name: Auto-bump versions

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: marketplace-release-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate marketplace source
        run: node .github/scripts/validate-marketplace.mjs

      - name: Determine unreleased range and bump kind
        id: range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          EMPTY_TREE=$(git hash-object -t tree /dev/null)

          git cat-file -e "${EVENT_SHA}^{commit}"
          if [ "$EVENT_BEFORE" = "$ZERO" ]; then
            event_range="$EMPTY_TREE..$EVENT_SHA"
            initial_push=true
          else
            git cat-file -e "${EVENT_BEFORE}^{commit}"
            git merge-base --is-ancestor "$EVENT_BEFORE" "$EVENT_SHA"
            event_range="$EVENT_BEFORE..$EVENT_SHA"
            initial_push=false
          fi
          git merge-base --is-ancestor "$EVENT_SHA" HEAD || {
            echo "The pushed commit is not on current main; refusing to release a stale range." >&2
            exit 1
          }

          release_base=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | sed -n '1p')
          if [ -n "$release_base" ]; then
            range="$release_base..HEAD"
            initial_push=false
          else
            range="$event_range"
          fi

          if [ "$initial_push" = true ]; then
            git log --format='%B%n' "$EVENT_SHA" > "$RUNNER_TEMP/commit-messages"
          else
            git log --format='%B%n' "$range" > "$RUNNER_TEMP/commit-messages"
          fi
          if grep -qE '^[[:alnum:]][[:alnum:]-]*(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' "$RUNNER_TEMP/commit-messages"; then
            kind=major
          elif grep -qE '^feat(\([^)]*\))?:' "$RUNNER_TEMP/commit-messages"; then
            kind=minor
          else
            kind=patch
          fi

          echo "Event range: $event_range"
          echo "Unreleased range: $range"
          echo "Bump kind: $kind"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "initial_push=$initial_push" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Bump versions
        id: bump
        env:
          RANGE: ${{ steps.range.outputs.range }}
          INITIAL_PUSH: ${{ steps.range.outputs.initial_push }}
          KIND: ${{ steps.range.outputs.kind }}
        run: |
          set -euo pipefail
          MARKETPLACE=.crouter-marketplace/marketplace.json
          SETV="node .github/scripts/set-version.mjs"

          bump_version() {
            local v="$1" kind="$2" major minor patch
            IFS=. read -r major minor patch <<<"$v"
            case "$kind" in
              major) echo "$((major+1)).0.0" ;;
              minor) echo "$major.$((minor+1)).0" ;;
              patch) echo "$major.$minor.$((patch+1))" ;;
            esac
          }

          read_version() {
            grep -m1 -E '^[[:space:]]{0,2}"version":' "$1" \
              | sed -E 's/.*"version":[[:space:]]*"([^"]+)".*/\1/'
          }

          changed_files() {
            if [ "$INITIAL_PUSH" = true ]; then
              git diff-tree --root --no-commit-id --name-only -r "$RANGE" -- "$@"
            else
              git diff --name-only "$RANGE" -- "$@"
            fi
          }

          changed_status() {
            if [ "$INITIAL_PUSH" = true ]; then
              git diff-tree --root --no-commit-id --name-status -r "$RANGE" -- "$@"
            else
              git diff --name-status "$RANGE" -- "$@"
            fi
          }

          changed_plugins=$(changed_files plugins \
            | awk -F/ 'NF >= 2 && $1 == "plugins" { print $2 }' \
            | sort -u)
          marketplace_changed=$(changed_files "$MARKETPLACE")

          bumped=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            pfile="plugins/$name/.crouter-plugin/plugin.json"
            if [ ! -f "$pfile" ]; then
              echo "skip $name: no plugin.json"
              continue
            fi
            status=$(changed_status "$pfile" | awk 'NR == 1 { print $1 }')
            if [ "$status" = "A" ]; then
              echo "skip $name: plugin.json newly added"
              continue
            fi
            old=$(read_version "$pfile")
            new=$(bump_version "$old" "$KIND")
            echo "$name: $old -> $new"
            $SETV "$pfile" "$new"
            $SETV "$MARKETPLACE" "$new" --plugin "$name"
            bumped=1
          done <<< "$changed_plugins"

          if [ "$bumped" -eq 1 ] || [ -n "$marketplace_changed" ]; then
            old=$(read_version "$MARKETPLACE")
            new=$(bump_version "$old" "$KIND")
            echo "marketplace: $old -> $new"
            $SETV "$MARKETPLACE" "$new"
            echo "new_version=$new" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to bump."
          fi

      - name: Commit and tag
        if: steps.bump.outputs.new_version != ''
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No file changes after bump; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push --follow-tags
